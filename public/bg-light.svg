<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f3f7"/>
      <stop offset="1" stop-color="#eceff5"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#e8ecf3"/>
      <stop offset="0.5" stop-color="#f3f5f9"/>
      <stop offset="1" stop-color="#fbfcfd"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#dde3ed"/>
      <stop offset="0.55" stop-color="#edf0f6"/>
      <stop offset="1" stop-color="#fafbfd"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#e2e7f0"/>
      <stop offset="0.6" stop-color="#f1f3f8"/>
      <stop offset="1" stop-color="#fbfcfd"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#base)"/>

  <!-- Each wave: a blurred shadow just above it, then the wave itself. -->
  <path transform="translate(0 -10)" filter="url(#soft)" fill="#cfd6e2" opacity="0.35"
        d="M0 480 C260 300 520 200 720 215 C960 235 1180 300 1440 300 L1440 900 L0 900 Z"/>
  <path fill="url(#wave1)"
        d="M0 480 C260 300 520 200 720 215 C960 235 1180 300 1440 300 L1440 900 L0 900 Z"/>

  <path transform="translate(0 -10)" filter="url(#soft)" fill="#c9d1df" opacity="0.4"
        d="M0 650 C220 470 470 390 680 400 C900 412 1100 500 1440 520 L1440 900 L0 900 Z"/>
  <path fill="url(#wave2)"
        d="M0 650 C220 470 470 390 680 400 C900 412 1100 500 1440 520 L1440 900 L0 900 Z"/>

  <path transform="translate(0 -8)" filter="url(#soft)" fill="#cfd6e2" opacity="0.35"
        d="M0 860 C260 780 480 760 640 775 C860 795 1120 860 1440 880 L1440 900 L0 900 Z"/>
  <path fill="url(#wave3)"
        d="M0 860 C260 780 480 760 640 775 C860 795 1120 860 1440 880 L1440 900 L0 900 Z"/>
</svg>
