<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PORK CCIG Compiler</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230078d4'/%3E%3Cpath d='M6 4 3 8l3 4M10 4l3 4-3 4' stroke='white' stroke-width='1.6' fill='none'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Defaults to light.
      (function () {
        var theme = 'light';
        try {
          if (localStorage.getItem('pork-theme') === 'dark') theme = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
