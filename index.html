<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PORK CCIG Compiler</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Defaults to light.
      (function () {
        var theme = 'light';
        try {
          if (localStorage.getItem('pork-theme') === 'dark') theme = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
